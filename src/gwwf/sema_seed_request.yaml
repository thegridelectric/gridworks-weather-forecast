# Seed request for gridworks-weather-forecast (gwwf).
#
# Drives `uv run sema snapshot prepare ... && sema snapshot build --package-name gwwf`
# (run from the sema repo). Output appears under sema/output/sema/; copy it
# into src/gwwf/sema/ to refresh the vendored snapshot.
#
# The gw.weather.* words are the service's vocabulary: the two message
# words, plus the .gt record words whose canonical seed is the
# gridworks-weather DB. The closure pulls the fidelity enum and
# gw1.quantity / gw1.unit. Legacy `weather` (v000) stays while the
# actor still publishes it; it leaves the seed with the last legacy
# import.

initial_targets:
  types:
    gw.weather.observation: {}
    gw.weather.forecast: {}
    gw.weather.channel.gt: {}
    gw.weather.forecast.bundle.gt: {}
    gw.weather.forecast.channel.gt: {}
    gw.weather.location.gt: {}
    gw.weather.create.cmd: {}
    gw.weather.cmd.ack: {}
    gw.weather.cmd.nack: {}
    glitch: {}
    weather: {}

# Local class/module names drop the gw ceremony inside this package:
# gw.weather.observation -> WeatherObservation, gw1.unit -> Unit. Wire
# TypeNames are untouched.
local_names:
  strip_prefixes: [gw1, gw]
